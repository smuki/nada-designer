name: Publish to npm

# ===== 使用方式 =====
# 1) 在 GitHub 仓库 Settings -> Secrets and variables -> Actions 里新建 secret：NPM_TOKEN
#    （npmjs.com -> Access Tokens -> Generate New Token，类型选 Automation 或 Granular，
#      权限 Read and write；包首次发布前 Granular 选不到具体包，只能选 All packages）
# 2) 本地改好版本号并提交后打 tag 推送：
#      git tag v1.1.15 && git push origin v1.1.15
#    或者到 Actions 页面手动 Run workflow
#
# 版本号已发布过会自动跳过（可安全重跑）。
# 该流程不需要 npm 组织/scope，包名均为非 scope 形式。
#
# 【可选】想要 npm provenance（可信来源证明）：仓库必须是 public，然后
#   1) 顶层加：permissions: { contents: read, id-token: write }
#   2) 发布命令加 --provenance 并设置 NPM_CONFIG_PROVENANCE: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./packages/nada-designer/package.json').version")
          echo "tag=$TAG  package.json version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag ($TAG) 与 packages/nada-designer/package.json 的 version ($VER) 不一致"
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: npx vitest run

      - name: Build
        run: |
          pnpm --filter nada-designer build
          pnpm --filter nada-designer-element-plus build
          pnpm --filter nada-designer-antd build
          pnpm --filter nada-designer-naive-ui build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          publish() {
            local name="$1" dir="$2"
            local ver
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "⏭   $name@$ver 已存在，跳过"
              return 0
            fi
            echo "📦  发布 $name@$ver"
            ( cd "$dir" && pnpm publish --access public --no-git-checks )
          }
          publish nada-designer                  packages/nada-designer
          publish nada-designer-element-plus     packages/ui/elementPlus
          publish nada-designer-antd             packages/ui/antd
          publish nada-designer-naive-ui         packages/ui/naiveUi
