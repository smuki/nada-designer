name: Publish to npm

# 用法：
#   1) 在 GitHub 仓库 Settings -> Secrets and variables -> Actions 里添加 secret: NPM_TOKEN
#   2) 本地改好版本号后打 tag 并推送：  git tag v1.1.14 && git push origin v1.1.14
#   或者到 Actions 页面手动 Run workflow
#
# NPM_TOKEN 建议用 npmjs.com 的 Granular Access Token：
#   Permissions: Read and write
#   Expiration: 90 天以内
#   （包还不存在时只能选 All packages；发布过一次后可以收紧到具体包）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # provenance（可信来源证明）需要 id-token
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        # 上游遗留的 deepEqual 循环引用用例目前是红的，
        # 修好之后请把 continue-on-error 删掉，让测试成为发布闸门
        continue-on-error: true
        run: npx vitest run

      - name: Build core
        run: pnpm --filter nada-designer build

      - name: Build UI adapters
        run: |
          pnpm --filter @nada-designer/element-plus build
          pnpm --filter @nada-designer/antd build
          pnpm --filter @nada-designer/naive-ui build

      - name: Publish @nada-designer core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm --filter nada-designer publish --access public --no-git-checks --provenance

      - name: Publish UI adapters
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          # UI 适配包可以只发你用到的；这里默认三套都发
          pnpm --filter @nada-designer/element-plus publish --access public --no-git-checks --provenance
          pnpm --filter @nada-designer/antd publish --access public --no-git-checks --provenance
          pnpm --filter @nada-designer/naive-ui publish --access public --no-git-checks --provenance
